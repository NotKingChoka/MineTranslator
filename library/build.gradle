architectury {
    platformSetupLoomIde()
    fabric()
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$fabric_loader_version"
}

processResources {
    inputs.property 'version', "$mod_version"

    filesMatching('fabric.mod.json') {
        expand(
            version: "$mod_version",
            minecraft_version_fabric_range: "$minecraft_version_fabric_range",
            fabric_loader_version_range: "$fabric_loader_version_range"
        )
    }
}

jar {
    manifest {
        attributes([
            'Specification-Title': 'minetranslatorlib',
            'Specification-Vendor': 'NotKingChoka',
            'Specification-Version': '1',
            'Implementation-Title': 'MineTranslator Library',
            'Implementation-Version': "$mod_version",
            'Implementation-Vendor': 'NotKingChoka'
        ])
    }
}
