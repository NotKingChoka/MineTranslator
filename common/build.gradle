architectury {
    common('fabric', 'neoforge')
}

loom {
    accessWidenerPath = project(":fabric").file("src/main/resources/minetranslator.accesswidener")
}

dependencies {
    // Compile-time Mixin annotations. Fabric Loader is the loader itself,
    // not Fabric API, and is never bundled into MineTranslator.
    modCompileOnly "net.fabricmc:fabric-loader:$fabric_loader_version"
}
