base {
    archivesName = "MineTranslator-${minecraft_version}"
}

def isLegacy = minecraft_version.toString().startsWith("1.19") ||
               minecraft_version.toString().startsWith("1.18") ||
               minecraft_version.toString().startsWith("1.17") ||
               minecraft_version.toString() == "1.16.5"

if (isLegacy) {
    sourceSets.main.java.srcDir "src/1.16.5/java"
    sourceSets.main.java.exclude "**/config/gui/ui/**"
}

dependencies {
    compileOnly project(path: ':library', configuration: 'namedElements')
    runtimeOnly project(path: ':library', configuration: 'namedElements')
    compileOnly 'com.google.code.gson:gson:2.8.0'
}

processResources {
    inputs.property 'version', mod_version
    inputs.property 'minecraft_version', minecraft_version
    filesMatching('fabric.mod.json') {
        expand(version: mod_version, minecraft_version: minecraft_version)
    }
}
