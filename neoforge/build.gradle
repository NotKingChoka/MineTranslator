plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$neoforge_version"

    // Cloth Config
    modCompileOnly "me.shedaniel.cloth:cloth-config-neoforge:$cloth_config_version"

    // JEI, REI, EMI?  (Unused)
//    modCompileOnly "mezz.jei:jei-$minecraft_version-neoforge-api:$jei_version"
//    modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-neoforge:$rei_version"

    modRuntimeOnly "mezz.jei:jei-$minecraft_version-neoforge:$jei_version"
//    modRuntimeOnly "me.shedaniel:RoughlyEnoughItems-neoforge:$rei_version"

    // FTB Quests

    // Jade
    modRuntimeOnly "maven.modrinth:jade:$jade_neoforge_version"

    // Wynntils
//    modRuntimeOnly "maven.modrinth:wynntils:$wynntils_neoforge_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    inputs.property 'version', "$mod_version"

    filesMatching(['META-INF/neoforge.mods.toml', 'META-INF/compat.neoforge.mods.toml']) {
        expand([
                version: "$mod_version",
                neoforge_version_range: "$neoforge_version_range",
                minecraft_version_neoforge_range: "$minecraft_version_neoforge_range",
        ])
    }
}

jar {
    exclude 'net/kingchoka/minetranslator/compat/**'
    exclude 'net/kingchoka/minetranslator/config/gui/**'
    exclude 'META-INF/compat.neoforge.mods.toml'
    manifest {
        attributes([
                'Specification-Title'     : "$mod_id",
                'Specification-Vendor'    : "NotKingChoka",
                'Specification-Version'   : "1",
                'Implementation-Title'    : "$archiveBaseName",
                'Implementation-Version'  : this.project.jar.archiveVersion,
                'Implementation-Vendor'   : "NotKingChoka",
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
    exclude 'net/kingchoka/minetranslator/compat/**'
    exclude 'net/kingchoka/minetranslator/config/gui/**'
    exclude 'META-INF/compat.neoforge.mods.toml'
}

remapJar {
    input.set shadowJar.archiveFile
}

task compatJar(type: Jar) {
    archiveClassifier = 'compat-dev'
    from sourceSets.main.output
    from project(':common').sourceSets.main.output
    
    include 'net/kingchoka/minetranslator/compat/**'
    include 'net/kingchoka/minetranslator/config/gui/**'
    include 'net/kingchoka/minetranslator/neoforge/MTMixinPluginImpl.class'
    include 'META-INF/compat.neoforge.mods.toml'
    include 'META-INF/accesstransformer.cfg'
    include 'assets/**'
    include 'icon.png'
    include 'META-INF/services/**'
    
    rename 'META-INF/compat.neoforge.mods.toml', 'META-INF/neoforge.mods.toml'
}

import net.fabricmc.loom.task.RemapJarTask

task remapCompatJar(type: RemapJarTask, dependsOn: compatJar) {
    input = compatJar.archiveFile
    archiveClassifier = 'compat'
    addNestedDependencies = false
}

assemble.dependsOn remapCompatJar
