plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    accessWidenerPath = file("src/main/resources/MineTranslator.accesswidener")
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$fabric_api_version+$minecraft_version"

    // Mod Menu
    modImplementation "com.terraformersmc:modmenu:$modmenu_version"

    // Cloth Config
    modRuntimeOnly("me.shedaniel.cloth:cloth-config-fabric:$cloth_config_version") { exclude(group: "net.fabricmc.fabric-api") }

    // JEI, REI, EMI? (Unused)
//    modCompileOnly "mezz.jei:jei-$minecraft_version-fabric-api:$jei_version"
//    modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:$rei_version"

//    modRuntimeOnly "mezz.jei:jei-$minecraft_version-fabric:$jei_version"  // (Loom version is too high)
    modRuntimeOnly "me.shedaniel:RoughlyEnoughItems-fabric:$rei_version"

    // FTB Quests

    // Jade
//    modImplementation "maven.modrinth:jade:$jade_fabric_version"  // (Loom version is too high)

    // Wynntils
    modRuntimeOnly "maven.modrinth:wynntils:$wynntils_fabric_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', "$mod_version"
    inputs.property 'group', "$maven_group"

    filesMatching(['fabric.mod.json', 'compat.fabric.mod.json']) {
        expand(
                version: "$mod_version",
                minecraft_version_fabric_range: "$minecraft_version_fabric_range",
                fabric_loader_version_range: "$fabric_loader_version_range",
                fabric_api_version_range: "$fabric_api_version_range"
        )
    }
}

jar {
    exclude 'net/kingchoka/minetranslator/compat/**'
    exclude 'net/kingchoka/minetranslator/config/gui/**'
    exclude 'compat.fabric.mod.json'
    manifest {
        attributes([
                'Specification-Title'     : "$mod_id",
                'Specification-Vendor'    : "NotKingChoka",
                'Specification-Version'   : "1",
                'Implementation-Title'    : "$archiveBaseName",
                'Implementation-Version'  : this.project.jar.archiveVersion,
                'Implementation-Vendor'   : "NotKingChoka",
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
    exclude 'net/kingchoka/minetranslator/compat/**'
    exclude 'net/kingchoka/minetranslator/config/gui/**'
    exclude 'compat.fabric.mod.json'
}

remapJar {
    input.set shadowJar.archiveFile
}

task compatJar(type: Jar) {
    archiveClassifier = 'compat-dev'
    from sourceSets.main.output
    from project(':common').sourceSets.main.output
    
    include 'net/kingchoka/minetranslator/compat/**'
    include 'net/kingchoka/minetranslator/config/gui/**'
    include 'net/kingchoka/minetranslator/fabric/MTMixinPluginImpl.class'
    include 'minetranslator.fabric.mixins.json'
    include 'minetranslator.mixins.json'
    include 'minetranslator.accesswidener'
    include 'assets/**'
    include 'icon.png'
    include 'compat.fabric.mod.json'
    include 'META-INF/services/**'
    
    rename 'compat.fabric.mod.json', 'fabric.mod.json'
}

import net.fabricmc.loom.task.RemapJarTask

task remapCompatJar(type: RemapJarTask, dependsOn: compatJar) {
    input = compatJar.archiveFile
    archiveClassifier = 'compat'
    addNestedDependencies = false
}

assemble.dependsOn remapCompatJar
